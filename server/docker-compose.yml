services:
  postgres:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: nearbyfeed
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-mysecretpassword}
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis-data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: always
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-nearbyfeed_observability}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-nearbyfeed}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-nearbyfeed}
    ports:
      - '${CLICKHOUSE_HTTP_HOST_PORT:-8123}:8123'
      - '${CLICKHOUSE_NATIVE_HOST_PORT:-9000}:9000'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./observability/clickhouse/init:/docker-entrypoint-initdb.d:ro

  grafana:
    image: grafana/grafana-oss:11.1.0
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-nearbyfeed}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-nearbyfeed_observability}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-nearbyfeed}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-nearbyfeed}
    ports:
      - '${GRAFANA_HOST_PORT:-3001}:3000'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards/nearbyfeed:ro
    depends_on:
      - clickhouse

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
  grafana-data:
