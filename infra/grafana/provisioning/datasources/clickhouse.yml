apiVersion: 1

datasources:
  - name: NearbyFeed ClickHouse
    uid: nearbyfeed-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      secure: false
      username: ${CLICKHOUSE_USER}
      defaultDatabase: ${CLICKHOUSE_DATABASE}
      defaultTable: nearbyfeed_events
      dialTimeout: 10
      queryTimeout: 30
      validateSql: false
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
